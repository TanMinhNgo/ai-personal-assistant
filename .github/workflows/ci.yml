name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Format and build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_INSFORGE_URL: https://ci-build.insforge.app
      NEXT_PUBLIC_INSFORGE_ANON_KEY: ci-build-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**/*', 'components/**/*', 'lib/**/*', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Build application
        run: npm run build
